services:
  - type: web
    name: contribo
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python3 -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GITHUB_TOKEN
        sync: false          # you paste this in the Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: contribo-db
          property: connectionString
      - key: CACHE_TTL_SECONDS
        value: "600"

databases:
  - name: contribo-db
    databaseName: contribo
    user: contribo_user
    plan: free

