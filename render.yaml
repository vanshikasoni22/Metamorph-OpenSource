services:
  - type: web
    name: contribo
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python3 -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GITHUB_TOKEN
        sync: false          # you paste this in the Render dashboard
      - key: DATABASE_URL
        sync: false          # optional: paste your PostgreSQL URL in Render dashboard, or leave empty for SQLite
      - key: CACHE_TTL_SECONDS
        value: "600"


