name: Contribo CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Database Migrations (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    # Real PostgreSQL service container for automated database testing
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: contribo_test
          POSTGRES_USER: contribo_user
          POSTGRES_PASSWORD: contribo_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql://contribo_user:contribo_password@localhost:5432/contribo_test
        run: |
          python -m backend.scripts.migrate

      - name: Run Pytest test suite
        env:
          DATABASE_URL: postgresql://contribo_user:contribo_password@localhost:5432/contribo_test
        run: |
          pytest tests/ -v

      - name: Verify static frontend files
        run: |
          test -f index.html
          test -f beginner.html
          test -f mentor.html
          test -f config.js
          test -f styles.css
          echo "Frontend static files verified successfully."
