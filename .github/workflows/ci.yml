
name: Contribo CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest test suite (SQLite)
        env:
          # Use SQLite for CI — no external DB needed
          DATABASE_URL: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYTHONPATH=. pytest tests/ -v --tb=short

      - name: Verify static frontend files
        run: |
          test -f index.html    && echo "✓ index.html"
          test -f beginner.html && echo "✓ beginner.html"
          test -f mentor.html   && echo "✓ mentor.html"
          test -f config.js     && echo "✓ config.js"
          test -f styles.css    && echo "✓ styles.css"
          test -f home.js      && echo "✓ home.js"
          test -f vercel.json   && echo "✓ vercel.json"

      - name: Build frontend static bundle
        run: |
          npm run build
          test -f dist/index.html    && echo "✓ dist/index.html"
          test -f dist/beginner.html && echo "✓ dist/beginner.html"
          test -f dist/mentor.html   && echo "✓ dist/mentor.html"
          test -f dist/home.js       && echo "✓ dist/home.js"
          test -f dist/styles.css    && echo "✓ dist/styles.css"
